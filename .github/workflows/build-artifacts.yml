name: Build Mobile APK & Desktop EXE Artifacts

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # 1. Android APK Build Job
  # -------------------------------------------------------------
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradle
        run: chmod +x ./android/gradlew

      - name: Build Debug APK with Gradle
        run: |
          cd android
          ./gradlew assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaptopAudioStream-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # -------------------------------------------------------------
  # 2. Windows Desktop EXE Build Job
  # -------------------------------------------------------------
  build-desktop-exe:
    name: Build Windows Desktop App (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Desktop Executable (Release)
        run: cargo build --release

      - name: Package Desktop Distribution
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist-desktop -Force
          Copy-Item "target/release/laptop-audio-stream.exe" "dist-desktop/" -Force
          Copy-Item -Path "web" -Destination "dist-desktop/web" -Recurse -Force
          Compress-Archive -Path "dist-desktop/*" -DestinationPath "LaptopAudioStream-Desktop-Windows-x64.zip" -Force

      - name: Upload Desktop Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaptopAudioStream-Desktop-Windows-x64
          path: LaptopAudioStream-Desktop-Windows-x64.zip
          if-no-files-found: error
