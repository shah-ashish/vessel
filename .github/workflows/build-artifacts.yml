name: Build Mobile APK & Desktop EXE Artifacts

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  # -------------------------------------------------------------
  # 1. Android APK Build Job (Official Gradle Action Pattern)
  # -------------------------------------------------------------
  build-android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.5'

      - name: Build Debug APK with Gradle
        run: |
          cd android
          gradle assembleDebug --stacktrace

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LaptopAudioStream-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # -------------------------------------------------------------
  # 2. Windows Desktop NSIS Installer Build Job
  # -------------------------------------------------------------
  build-desktop-exe:
    name: Build Windows Desktop App (NSIS Installer)
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build Desktop Executable (Release)
        run: cargo build --release

      - name: Add NSIS to PATH
        run: echo "C:\Program Files (x86)\NSIS" >> $env:GITHUB_PATH

      - name: Compile NSIS Windows Installer (.exe)
        run: makensis installer.nsi

      - name: Upload NSIS Installer Setup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vessel-Windows-Setup-Installer
          path: Vessel-Setup-x64.exe
          if-no-files-found: error
