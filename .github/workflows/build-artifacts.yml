name: Vessel Build and Release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    name: Android debug validation
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"
      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: Vessel-Android-Debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  windows-validation:
    name: Windows desktop validation
    if: "!startsWith(github.ref, 'refs/tags/')"
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build desktop executable
        run: cargo build --release
      - uses: nsis-dev/setup-nsis@v1
      - name: Build installer
        run: makensis installer.nsi
      - uses: actions/upload-artifact@v4
        with:
          name: Vessel-Windows-Installer
          path: Vessel-Setup-x64.exe
          if-no-files-found: error

  release-android:
    name: Build signed Android release APK
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"
      - name: Setup Android release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Using configured GitHub repository secret for Android signing."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vessel-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/vessel-release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD" >> "$GITHUB_ENV"
          else
            echo "Generating release signing key and PKCS12 keystore via OpenSSL on runner..."
            openssl genrsa -out /tmp/vessel-release.key 2048
            openssl req -new -x509 -key /tmp/vessel-release.key -out /tmp/vessel-release.crt -days 10000 -subj "/CN=Vessel/O=Vessel/C=IN"
            openssl pkcs12 -export -in /tmp/vessel-release.crt -inkey /tmp/vessel-release.key -out "$RUNNER_TEMP/vessel-release.p12" -name vessel -password pass:vessel123
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/vessel-release.p12" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=vessel123" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=vessel" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=vessel123" >> "$GITHUB_ENV"
            echo "ANDROID_STORE_TYPE=PKCS12" >> "$GITHUB_ENV"
          fi
      - name: Build signed release APK
        working-directory: android
        run: gradle assembleRelease --stacktrace
      - name: Name release APK
        shell: bash
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("version.json"))["version"])')"
          cp android/app/build/outputs/apk/release/*.apk "Vessel-Android-$VERSION.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: Vessel-Android-Release
          path: Vessel-Android-*.apk
          if-no-files-found: error

  release-windows:
    name: Build Windows release installer
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Validate release tag
        shell: pwsh
        run: |
          $manifest = Get-Content version.json | ConvertFrom-Json
          if ($manifest.releaseTag -ne $env:GITHUB_REF_NAME -or "v$($manifest.version)" -ne $env:GITHUB_REF_NAME) {
            throw "Git tag must match version.json releaseTag and version."
          }
      - name: Build desktop executable
        run: cargo build --release
      - uses: nsis-dev/setup-nsis@v1
      - name: Build versioned Windows installer
        shell: pwsh
        run: |
          makensis installer.nsi
          $version = (Get-Content version.json | ConvertFrom-Json).version
          Rename-Item Vessel-Setup-x64.exe "Vessel-Windows-Setup-$version.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: Vessel-Windows-Release
          path: Vessel-Windows-Setup-*.exe
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [release-android, release-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Vessel-Android-Release
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: Vessel-Windows-Release
          path: dist
      - name: Generate SHA-256 checksums
        working-directory: dist
        run: sha256sum Vessel-* > SHA256SUMS.txt
      - name: Create GitHub Release and upload installers
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/Vessel-Android-*.apk
            dist/Vessel-Windows-Setup-*.exe
            dist/SHA256SUMS.txt
